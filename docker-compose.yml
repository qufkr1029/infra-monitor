name: infra-monitor

services:
  collector:
    image: infra-monitor-collector:latest
    restart: unless-stopped
    environment:
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-5}
      HOST_PROC_PATH: /host/proc
      HOST_ROOT_PATH: /host/root
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
