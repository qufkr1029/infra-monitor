name: infra-monitor

services:
  backend:
    image: infra-monitor-backend:latest
    restart: unless-stopped

  collector:
    image: infra-monitor-collector:latest
    restart: unless-stopped
    environment:
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-10}
      HOST_PROC_PATH: /host/proc
      HOST_ROOT_PATH: /host/root
      COLLECTOR_LOG_DIR: /app/collector_logs
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5242880}
      METRICS_API_URL: http://backend:8080/api/metrics
    depends_on:
      - backend
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./collector_logs
        target: /app/collector_logs
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
